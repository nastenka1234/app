name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true
      - name: Create Android shell
        run: flutter create --platforms=android --org com.jojo --project-name study_companion shell
      - name: Overlay sources
        run: |
          cp pubspec.yaml shell/pubspec.yaml
          rm -rf shell/lib shell/assets shell/test
          cp -r lib shell/lib
          cp -r assets shell/assets
          python3 tool/patch_android.py shell
      - name: Analyze (informational)
        run: cd shell && flutter pub get && (flutter analyze --no-fatal-infos --no-fatal-warnings || true)
      - name: Build APK
        run: cd shell && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: study-companion-apk
          path: shell/build/app/outputs/flutter-apk/app-release.apk
