name: study_companion
description: همراه همیشگی دانش‌آموز
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  fl_chart: ^0.69.0
  shamsi_date: ^1.0.1
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  video_player: ^2.9.1
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  file_picker: ^8.1.2
flutter:
  uses-material-design: true
  fonts:
    - family: Sheed
      fonts:
        - asset: assets/fonts/Sheed-SemiBold.otf
        - asset: assets/fonts/Sheed-Bold.otf
          weight: 700
        - asset: assets/fonts/Sheed-Black.otf
          weight: 900
